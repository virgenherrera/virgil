# Layer taxonomy:
#   navigation  — document structure and routing
#   identity    — what Virgil IS (foundational definitions)
#   structure   — how Virgil is built (layer model)
#   lifecycle   — how projects flow through states
#   principles  — governance and architectural invariants
#   components  — what parts compose the system
#   interaction — how parts and actors relate
#   quality     — how quality is guaranteed (Echo, TDD, testing, supply chain)
#   knowledge   — where knowledge lives (persistence, RAG, codebaseMemory)
#   context     — how context flows between agents
#   recovery    — how state is recovered after failure
#   execution   — how work is executed (pipeline, Git, verification, gates)
#   operation   — post-delivery operational phase
#   authority   — constitutional authority and self-reference
#   reference   — glossary and term definitions

